name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - run: |
          bundle exec ruby -rpg -e 'puts "linked libpq: #{PG.library_version}"'
      - run: bundle exec rspec --exclude-pattern "spec/integration/**/*"

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL *server* majors only.
        pg: [14, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: Report client libpq vs server
        run: |
          bundle exec ruby -rpg -e 'puts "client libpq=#{PG.library_version} server_matrix=${{ matrix.pg }}"'
      - env:
          PG_PIPELINE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bundle exec rspec spec/integration
